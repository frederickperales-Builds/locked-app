<script>

<!-- Import map: lets the compiled app's plain `import React from "react"` etc.
     resolve to real packages via a CDN, with zero build step. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>
</head>
<body>
<div id="root"></div>

<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import LockedRoot from "./app.compiled.js";

  const root = createRoot(document.getElementById("root"));
  root.render(React.createElement(LockedRoot));
</script>
</body>
